<div class="container">
    <div class="row justify-content-center">
        <div class="col-12">
            <div id="scheduler">
                </div>
        </div>
    </div>
</div>


<script type='text/javascript' src="https://gge-deu-online--uatfull.sandbox.my.site.com/scheduler/lightning/lightning.out.js"></script>

<script type='text/javascript'>

    // Get URL parameters
    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    
    // Default to empty string if parameter is null
    const buCode = urlParams.get('buCode') || '';
    const languageCode = urlParams.get('languageCode') || '';

    // Initialize Lightning Out and create the component
    $Lightning.use(
        "c:embeddedFlowSchedulerApp", // Aura Application Name
        function() {
            $Lightning.createComponent(
                "c:embeddedFlowScheduler", // Aura Component Name
                // **PASSING ATTRIBUTES HERE** // These must map to attributes defined in c:embeddedFlowScheduler
                {
                    "buCode": buCode,
                    "languageCode": languageCode
                },
                "scheduler", // Target Element ID
                function(component) {
                    // Optional: Code to execute after component is successfully created
                    console.log("Salesforce Flow Component successfully loaded into div#scheduler.");
                }
            );
        },
        // Site Endpoint URL
        'https://gge-deu-online--uatfull.sandbox.my.site.com/scheduler' 
    );
</script>
