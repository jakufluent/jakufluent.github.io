<!DOCTYPE html>
<html lang="en">
   <head>
      <title>Salesforce Scheduler Test Embedded</title>
      
      <script type='text/javascript' src="https://gge-deu-online--uatfull.sandbox.my.site.com/scheduler/lightning/lightning.out.js"></script>    
      
      <script type='text/javascript'>     
          // Retrieve URL parameters
          const queryString = window.location.search;
          const urlParams = new URLSearchParams(queryString);
          
          // Define variables for passing to the component (handles null values)
          let urlParameter_DivisionCode = urlParams.get('divisionCode') != null ? urlParams.get('divisionCode') : '';
          let urlParameter_Language = urlParams.get('languageCode') != null ? urlParams.get('languageCode') : '';
          
          console.log("URL Parameters Retrieved:");
          console.log("Division Code:", urlParameter_DivisionCode);
          console.log("Language Code:", urlParameter_Language);
          
      </script>   
   </head>
   <body>
      <h1>This is an Integration Test from Salesforce to External Websites</h1>
      
      <div id="scheduler">
         Loading Salesforce Scheduler...
      </div>
      
      <script>
          $Lightning.use(
              "c:embeddedFlowSchedulerApp",
              function() {
                  console.log("Lightning App loaded successfully. Attempting to create component...");
                  
                  $Lightning.createComponent(
                      "c:embeddedFlowScheduler",
                      {
                          // **CRITICAL CHANGE:** Passing URL parameters as attributes to the component.
                          // 'divisionCode' and 'languageCode' must be defined as public properties (@api in LWC or attribute in Aura) 
                          // on the 'c:embeddedFlowScheduler' component.
                          divisionCode: urlParameter_DivisionCode,
                          languageCode: urlParameter_Language
                      },
                      "scheduler", // The DOM location (div id="scheduler")
                      function(cmp, status, errorMessage) { 
                          if (status === "SUCCESS") {
                              console.log("c:embeddedFlowScheduler component created successfully.");
                              document.getElementById("scheduler").innerHTML = ''; // Clear loading message
                          } else if (status === "ERROR") {
                              console.error("ERROR: Component failed to load.", errorMessage);
                              document.getElementById("scheduler").innerHTML = 'Error loading Scheduler.';
                          } else {
                              console.log("Component creation status:", status);
                          }
                      }
                  );
              },
              'https://gge-deu-online--uatfull.sandbox.my.site.com/scheduler' // Site endpoint
          );
      </script>
   </body>
</html>
